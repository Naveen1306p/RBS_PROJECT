{% macro render_field(field) -%}
  <div class="field">
    {{ field.label(class_="field-label") }}
    {{ field(class_="input", **kwargs) }}
    {% if field.errors %}
      <ul class="field-errors">{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>
    {% endif %}
  </div>
{%- endmacro %}
